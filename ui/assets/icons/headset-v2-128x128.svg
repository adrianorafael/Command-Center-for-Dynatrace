<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="128" height="128">
  <defs>
    <!-- Headband back gradient -->
    <linearGradient id="hbBack" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0%" stop-color="#3A60B0"/>
      <stop offset="50%" stop-color="#3558A5"/>
      <stop offset="100%" stop-color="#2C4A90"/>
    </linearGradient>
    <!-- Headband top gradient -->
    <linearGradient id="hbTop" x1="0" y1="0" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#7AAEF7"/>
      <stop offset="30%" stop-color="#629AF2"/>
      <stop offset="60%" stop-color="#528DEE"/>
      <stop offset="100%" stop-color="#4578D8"/>
    </linearGradient>
    <!-- Headband pad -->
    <linearGradient id="hbPad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5A88DE"/>
      <stop offset="100%" stop-color="#4270C0"/>
    </linearGradient>
    <!-- Left ear rim -->
    <linearGradient id="earRimL" x1="0" y1="0.5" x2="0.3" y2="0.5">
      <stop offset="0%" stop-color="#505C76"/>
      <stop offset="100%" stop-color="#626E88"/>
    </linearGradient>
    <!-- Right ear rim -->
    <linearGradient id="earRimR" x1="0.7" y1="0.5" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#68748E"/>
      <stop offset="100%" stop-color="#55607A"/>
    </linearGradient>
    <!-- Ear outer -->
    <linearGradient id="earOuter" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#A8B6D0"/>
      <stop offset="30%" stop-color="#92A0BA"/>
      <stop offset="70%" stop-color="#808CA6"/>
      <stop offset="100%" stop-color="#6E7A94"/>
    </linearGradient>
    <!-- Ear inner -->
    <linearGradient id="earInner" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#72809A"/>
      <stop offset="100%" stop-color="#58647E"/>
    </linearGradient>
    <!-- Ear deep -->
    <linearGradient id="earDeep" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#48546E"/>
      <stop offset="100%" stop-color="#38445E"/>
    </linearGradient>
    <!-- Boom dark -->
    <linearGradient id="boomDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2A8065"/>
      <stop offset="100%" stop-color="#257258"/>
    </linearGradient>
    <!-- Boom main -->
    <linearGradient id="boomMain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5CC8A8"/>
      <stop offset="40%" stop-color="#4CB898"/>
      <stop offset="100%" stop-color="#3CA282"/>
    </linearGradient>
    <!-- Mic face -->
    <linearGradient id="micFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#68D0B0"/>
      <stop offset="50%" stop-color="#4CB495"/>
      <stop offset="100%" stop-color="#3A9E80"/>
    </linearGradient>
    <!-- Mic bottom -->
    <linearGradient id="micBot" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#309072"/>
      <stop offset="100%" stop-color="#227055"/>
    </linearGradient>
    <!-- Shadow filter -->
    <filter id="dropShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="4" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <g transform="translate(256, 260)" filter="url(#dropShadow)">

    <!-- ====== HEADBAND BACK (3D depth layer) ====== -->
    <path d="
      M -128,25
      C -148,-95 -82,-193 8,-208
      C 93,-218 153,-138 138,8
      L 118,2
      C 132,-118 78,-193 8,-184
      C -68,-172 -122,-85 -106,18
      Z
    " fill="url(#hbBack)"/>

    <!-- ====== HEADBAND TOP SURFACE ====== -->
    <path d="
      M -106,18
      C -122,-85 -68,-172 8,-184
      C 78,-193 132,-118 118,2
      L 108,-2
      C 120,-105 70,-172 8,-164
      C -54,-155 -104,-78 -92,14
      Z
    " fill="url(#hbTop)"/>

    <!-- Headband highlight -->
    <path d="
      M -98,16
      C -112,-78 -58,-160 8,-172
      C 72,-180 126,-112 113,0
    " fill="none" stroke="white" stroke-opacity="0.12" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Cushion pad -->
    <path d="
      M -40,-175
      C -20,-185 30,-190 50,-182
      L 45,-162
      C 28,-168 -15,-166 -34,-158
      Z
    " fill="url(#hbPad)"/>

    <!-- ====== LEFT EAR ====== -->
    <g transform="translate(-130, 30) rotate(-7)">
      <!-- Rim (3D depth) -->
      <ellipse cx="-4" cy="0" rx="63" ry="75" fill="url(#earRimL)"/>
      <!-- Outer shell -->
      <ellipse cx="0" cy="0" rx="56" ry="72" fill="url(#earOuter)"/>
      <!-- Inner pad -->
      <ellipse cx="0" cy="0" rx="43" ry="55" fill="url(#earInner)"/>
      <!-- Speaker cavity -->
      <ellipse cx="0" cy="0" rx="31" ry="40" fill="url(#earDeep)"/>
      <!-- Grille dots -->
      <g fill="#303C55" fill-opacity="0.8">
        <circle cx="-14" cy="-14" r="3"/><circle cx="0" cy="-14" r="3"/><circle cx="14" cy="-14" r="3"/>
        <circle cx="-14" cy="0" r="3.2"/><circle cx="0" cy="0" r="3.2"/><circle cx="14" cy="0" r="3.2"/>
        <circle cx="-14" cy="14" r="3"/><circle cx="0" cy="14" r="3"/><circle cx="14" cy="14" r="3"/>
        <circle cx="-7" cy="-26" r="2.5"/><circle cx="7" cy="-26" r="2.5"/>
        <circle cx="-7" cy="26" r="2.5"/><circle cx="7" cy="26" r="2.5"/>
      </g>
      <!-- Edge highlight -->
      <path d="M -40,50 A 56,72 0 0,1 -50,-20" fill="none" stroke="white" stroke-opacity="0.12" stroke-width="2"/>
    </g>

    <!-- ====== RIGHT EAR ====== -->
    <g transform="translate(140, 10) rotate(5)">
      <!-- Rim (3D depth) -->
      <ellipse cx="4" cy="0" rx="66" ry="79" fill="url(#earRimR)"/>
      <!-- Outer shell -->
      <ellipse cx="0" cy="0" rx="60" ry="76" fill="url(#earOuter)"/>
      <!-- Inner pad -->
      <ellipse cx="0" cy="0" rx="46" ry="58" fill="url(#earInner)"/>
      <!-- Speaker cavity -->
      <ellipse cx="0" cy="0" rx="34" ry="43" fill="url(#earDeep)"/>
      <!-- Grille dots -->
      <g fill="#303C55" fill-opacity="0.8">
        <circle cx="-15" cy="-15" r="3.2"/><circle cx="0" cy="-15" r="3.2"/><circle cx="15" cy="-15" r="3.2"/>
        <circle cx="-15" cy="0" r="3.5"/><circle cx="0" cy="0" r="3.5"/><circle cx="15" cy="0" r="3.5"/>
        <circle cx="-15" cy="15" r="3.2"/><circle cx="0" cy="15" r="3.2"/><circle cx="15" cy="15" r="3.2"/>
        <circle cx="-8" cy="-28" r="2.8"/><circle cx="8" cy="-28" r="2.8"/>
        <circle cx="-8" cy="28" r="2.8"/><circle cx="8" cy="28" r="2.8"/>
      </g>
      <!-- Edge highlight -->
      <path d="M -44,54 A 60,76 0 0,1 -54,-22" fill="none" stroke="white" stroke-opacity="0.12" stroke-width="2.2"/>
      <!-- LED glow -->
      <circle cx="30" cy="-42" r="14" fill="#47AE8F" fill-opacity="0.1"/>
      <circle cx="30" cy="-42" r="9" fill="#47AE8F" fill-opacity="0.2"/>
      <circle cx="30" cy="-42" r="5.5" fill="#50C0A0" fill-opacity="0.95"/>
      <circle cx="28.5" cy="-44" r="1.8" fill="white" fill-opacity="0.5"/>
    </g>

    <!-- ====== MICROPHONE BOOM ====== -->
    <!-- Dark underside -->
    <path d="
      M -130,66
      C -140,128 -115,182 -72,207
      C -35,229 5,227 22,215
    " fill="none" stroke="url(#boomDark)" stroke-width="12" stroke-linecap="round"/>
    <!-- Main tube -->
    <path d="
      M -128,62
      C -138,122 -113,176 -70,202
      C -35,224 5,222 20,210
    " fill="none" stroke="url(#boomMain)" stroke-width="9" stroke-linecap="round"/>
    <!-- Highlight -->
    <path d="
      M -126,58
      C -136,115 -112,168 -70,194
    " fill="none" stroke="#78E0C0" stroke-opacity="0.35" stroke-width="2.5" stroke-linecap="round"/>

    <!-- ====== MICROPHONE HEAD ====== -->
    <g transform="translate(24, 212) rotate(8)">
      <!-- 3D bottom -->
      <path d="
        M -27,2
        C -27,14 -15,22 0,22
        C 15,22 27,14 27,2
        L 27,10
        C 27,22 15,28 0,28
        C -15,28 -27,22 -27,10
        Z
      " fill="url(#micBot)"/>
      <!-- Front face -->
      <ellipse cx="0" cy="0" rx="27" ry="19" fill="url(#micFace)"/>
      <!-- Grille rings -->
      <ellipse cx="0" cy="0" rx="21" ry="15" fill="none" stroke="#30886C" stroke-opacity="0.45" stroke-width="1.6"/>
      <ellipse cx="0" cy="0" rx="15" ry="10.5" fill="none" stroke="#30886C" stroke-opacity="0.35" stroke-width="1.2"/>
      <ellipse cx="0" cy="0" rx="8" ry="5.5" fill="none" stroke="#30886C" stroke-opacity="0.25" stroke-width="0.9"/>
      <!-- Center dot -->
      <circle cx="0" cy="0" r="3" fill="#30886C" fill-opacity="0.5"/>
      <!-- Specular -->
      <ellipse cx="-8" cy="-7" rx="8" ry="5" fill="white" fill-opacity="0.08"/>
      <!-- Indicator LED -->
      <circle cx="16" cy="-6" r="3.5" fill="#61BAB1" fill-opacity="0.9"/>
      <circle cx="15" cy="-7.5" r="1.2" fill="white" fill-opacity="0.4"/>
    </g>

    <!-- ====== SIGNAL WAVES ====== -->
    <g transform="translate(65, 200) rotate(6)">
      <!-- Wave 1 -->
      <path d="M 0,0 C 7,-14 13,-14 18,0" fill="none" stroke="#47AE8F" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round"/>
      <path d="M 0,0 C 7,14 13,14 18,0" fill="none" stroke="#47AE8F" stroke-opacity="0.4" stroke-width="3" stroke-linecap="round"/>
      <!-- Wave 2 -->
      <path d="M 8,0 C 17,-22 25,-22 30,0" fill="none" stroke="#55BBA0" stroke-opacity="0.38" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 8,0 C 17,22 25,22 30,0" fill="none" stroke="#55BBA0" stroke-opacity="0.27" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Wave 3 -->
      <path d="M 16,0 C 28,-30 38,-30 44,0" fill="none" stroke="#61BAB1" stroke-opacity="0.22" stroke-width="2" stroke-linecap="round"/>
      <path d="M 16,0 C 28,30 38,30 44,0" fill="none" stroke="#61BAB1" stroke-opacity="0.15" stroke-width="2" stroke-linecap="round"/>
    </g>

  </g>
</svg>
