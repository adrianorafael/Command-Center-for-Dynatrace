<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>Command Center for Dynatrace</title>
  <defs>
    <linearGradient id="cc-tile" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#2e4280"/>
      <stop offset="1" stop-color="#111936"/>
    </linearGradient>
    <linearGradient id="cc-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cc-band" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#86b6ff"/>
      <stop offset="1" stop-color="#3f6fd8"/>
    </linearGradient>
    <linearGradient id="cc-cup" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d3dbeb"/>
      <stop offset="1" stop-color="#8592b0"/>
    </linearGradient>
    <linearGradient id="cc-mic" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5be3b2"/>
      <stop offset="1" stop-color="#25b583"/>
    </linearGradient>
    <filter id="cc-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#cc-tile)"/>
  <rect width="128" height="128" rx="28" fill="url(#cc-sheen)"/>
  <g transform="translate(0 -7)" filter="url(#cc-shadow)">
    <path d="M33 70a31 31 0 0 1 62 0" fill="none" stroke="url(#cc-band)" stroke-width="11" stroke-linecap="round"/>
    <path d="M42 98c0 9 7 13 16 13" fill="none" stroke="url(#cc-mic)" stroke-width="6" stroke-linecap="round"/>
    <rect x="56" y="105" width="18" height="12" rx="6" fill="url(#cc-mic)"/>
    <path d="M80 104a8 8 0 0 1 0 14" fill="none" stroke="#5be3b2" stroke-opacity="0.7" stroke-width="3.5" stroke-linecap="round"/>
    <rect x="22" y="60" width="26" height="40" rx="13" fill="url(#cc-cup)"/>
    <rect x="80" y="60" width="26" height="40" rx="13" fill="url(#cc-cup)"/>
    <rect x="29" y="68" width="12" height="24" rx="6" fill="#36425f"/>
    <rect x="87" y="68" width="12" height="24" rx="6" fill="#36425f"/>
    <circle cx="104" cy="60" r="8" fill="url(#cc-mic)" stroke="#1d2a55" stroke-width="4"/>
  </g>
</svg>
